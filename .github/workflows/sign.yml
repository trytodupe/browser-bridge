name: Lint, Test & Sign XPI

on:
  push:
    branches: [main]
    paths:
      - addon/**
      - host/**
      - tests/**
      - package.json
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: node --test tests/mcp-server.test.js
      - name: Lint and build unsigned archive
        run: |
          npx --yes web-ext lint --source-dir addon
          npx --yes web-ext build --source-dir addon --artifacts-dir dist --overwrite-dest
      - name: Sign unlisted XPI via AMO (when secrets configured)
        if: env.AMO_API_KEY != '' && env.AMO_API_SECRET != ''
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          npx --yes web-ext sign \
            --channel=unlisted \
            --source-dir addon \
            --artifacts-dir dist \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-bridge-dist
          path: dist/*
          if-no-files-found: error
